spring.application.name=expense-api

# Default team limit per claim, in US dollars. Profiles override it.
expenses.max-claim-amount=500.00

# Actuator: only health and metrics over HTTP. Settings (env, configprops, beans...) stay hidden.
management.endpoints.web.exposure.include=health,metrics

# Problem details (RFC 9457) for Spring MVC's own errors too (404 route, 405, 415...).
spring.mvc.problemdetails.enabled=true
